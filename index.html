<!DOCTYPE html>
<html>
    <head>
        <title>YT downloader</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="icon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Monoton&family=Slabo+13px&display=swap" rel="stylesheet">
    </head>
    <body>
        <nav class="navTop">
            <h1 id="title">YT downloader</h1>
        </nav>
        <main>
            <div id="square-div">
                <div id="square">
                    <input id="url" type="text" class="inp" name="URL" placeholder="Type the URL here">
                    <h2 >OPTIONS:</h2>
                    <label><input id="wideo" type="checkbox" class="checkbox" name="wideo">Wideo</label>
                    <label><input id="path" type="checkbox" class="checkbox" name="path">Change the path of the dowloaded file</label>
                    <label id="path_label" for="path_value">Give the new path where to download the file</label>
                    <input id="path_value" class="inp" type="text" name="quality_value_sound" placeholder="Path">
                    <button id="path_button">Choose path</button>
                    <label><input id="quality" type="checkbox" class="checkbox" name="quality">Change video quality (default: best)</label>
                    <label id="quality_label" for="quality_value">Ex. 144, 1080, 1440, etc.</label>
                    <input id="quality_value" class="inp" type="number" name="quality_value" placeholder="Give the size of the wideo">
                    <label><input id="quality_sound" class="checkbox" type="checkbox" name="quality_sound">Change sound quality (default: best)</label>
                    <label id="quality_label_sound" for="quality_value_sound">Quality (best) 0 - 10 (worst)</label>
                    <input id="quality_value_sound" class="inp" type="number" name="quality_value_sound" placeholder="Give the quality of the sound">
                    <label><input id="playlist" type="checkbox" class="checkbox" name="playlist">Playlist</label>
                    <button id="download">download</button>
                    <button id="update">update downloader</button>
                    <div id="output-div">
                        <h1 id="output"></h1>
                    </div>
                </div>
            </div>
        </main>
        <footer class="stopka">
            <p class="kontakt">Kontakt:</p>
            <p class="kontakt">u203_krzdab_waw@technischools.com</p>
            <p>&copy; Krzysztof 2026</p>
        </footer>
        <script src="javascript.js"></script>
    </body>
</html>
