<!DOCTYPE html>
<html>
    <head>
        <title>YT downloader</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="navTop">
            <h1 id="title">YT downloader</h1>
        </nav>
        <main>
            <div id="square-div">
                <div id="square">
                    <input id="url" type="text" name="URL" placeholder="Type the URL here">
                    <h2 >options:</h2>
                    <label><input id="wideo" type="checkbox" name="wideo">Wideo</label>
                    <label><input id="quality" type="checkbox" name="quality">change the quality (deafult best)</label>
                    <input id="quality_value" type="number" name="quality_value" placeholder="Give the size of the wideo">
                    <label><input id="playlist" type="checkbox" name="playlist">Playlist</label>
                    <button id="download">download</button>
                    <button id="update">update downloader</button>
                    <h1 id="input"></h1>
                </div>
            </div>
        </main>
        <footer class="stopka">
            <p class="kontakt">Kontakt:</p>
            <p class="kontakt">krzysztof.dabrowski@lafontaine.edu.pl</p>
            <p>&copy; Krzysztof 2026</p>
        </footer>
        <script src="javascript.js"></script>
    </body>
</html>
